<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTRY-AI | Log Anomaly Detection</title>
    <!-- React & Libraries — ORDER MATTERS: Babel must load AFTER Recharts -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
    <script src="/assets/recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <div id="error-console"
        style="position: fixed; top: 0; left: 0; width: 100%; z-index: 10000; background: rgba(255,0,0,0.9); color: white; padding: 10px; font-family: monospace; display: none;">
    </div>
    <script>
        window.onerror = function (msg, url, line) {
            const err = document.getElementById('error-console');
            err.style.display = 'block';
            err.innerHTML += `<div>${msg} at ${line}</div>`;
        };
    </script>

    <style>
        :root {
            --primary: #00f2ff;
            --primary-glow: rgba(0, 242, 255, 0.5);
            --secondary: #7000ff;
            --accent: #ff007a;
            --success: #00ffa3;
            --warning: #ffb800;
            --bg-deep: #05060f;
            --bg-card: rgba(15, 17, 34, 0.7);
            --bg-sidebar: rgba(10, 11, 22, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --glass: blur(12px) saturate(180%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-deep);
            color: var(--text-main);
            overflow: hidden;
            /* We'll use custom scroll containers */
            height: 100vh;
            width: 100vw;
        }

        /* Animated Background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.1) 0%, transparent 40%);
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        /* Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            backdrop-filter: var(--glass);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .nav-item:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: var(--primary);
            background: rgba(0, 242, 255, 0.1);
            box-shadow: inset 0 0 0 1px rgba(0, 242, 255, 0.2);
        }

        /* Main Content */
        .main-content {
            overflow-y: auto;
            padding: 40px;
            background: radial-gradient(circle at top right, rgba(0, 242, 255, 0.03), transparent 30%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-dim);
        }

        /* Dashboard Components */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: var(--glass);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .stat-trend {
            font-size: 0.8rem;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trend-up {
            color: var(--success);
        }

        .trend-down {
            color: var(--accent);
        }

        /* Charts */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: var(--glass);
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Alerts Table */
        .alerts-table {
            width: 100%;
            border-collapse: collapse;
        }

        .alerts-table th {
            text-align: left;
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px 10px;
            border-bottom: 1px solid var(--border);
        }

        .alerts-table td {
            padding: 18px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .severity-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sev-high {
            background: rgba(255, 0, 122, 0.15);
            color: #ff007a;
            border: 1px solid rgba(255, 0, 122, 0.2);
        }

        .sev-medium {
            background: rgba(255, 184, 0, 0.15);
            color: #ffb800;
            border: 1px solid rgba(255, 184, 0, 0.2);
        }

        .sev-low {
            background: rgba(0, 242, 255, 0.15);
            color: #00f2ff;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        /* Forms & Inputs */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-family: var(--font-main);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn {
            background: var(--primary);
            color: var(--bg-deep);
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: rgba(0, 242, 255, 0.05);
        }

        /* Training Progress */
        .progress-container {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            transition: width 0.5s ease;
        }

        /* Anomaly Detail Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 32px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            cursor: pointer;
            color: var(--text-dim);
        }

        /* Token Explainer */
        .token-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .token-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .token-importance {
            height: 4px;
            border-radius: 2px;
            background: var(--primary);
        }

        /* Loading Spinner */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }
    </style>
</head>

<body>
    <div class="bg-mesh"></div>
    <div class="bg-grid"></div>
    <div id="root"></div>

    <script type="text/babel">
        console.log("Sentry-AI Dashboard Script Loading...");
        const { useState, useEffect, useRef, useMemo } = React;

        if (typeof window.Recharts === 'undefined') {
            console.error("Recharts library failed to load!");
            document.getElementById('error-console').style.display = 'block';
            document.getElementById('error-console').innerHTML = "Error: Recharts library not found. Check if recharts.js is loaded correctly.";
        }

        const RechartsLib = window.Recharts || {};
        const {
            LineChart, Line, AreaChart, Area, BarChart, Bar,
            XAxis, YAxis, CartesianGrid, Tooltip, Legend,
            ResponsiveContainer, Cell
        } = RechartsLib;

        // Custom Hook for Lucide Icons
        const useIcons = () => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                'layout': '📊',
                'activity': '📈',
                'search': '🔍',
                'cpu': '⚙️',
                'settings': '🛠️',
                'shield-check': '🛡️',
                'database': '💾',
                'users': '👥',
                'alert-triangle': '⚠️',
                'target': '🎯',
                'refresh-cw': '🔄',
                'calendar': '📅',
                'play': '▶️',
                'info': 'ℹ️',
                'cloud-lightning': '⛈️',
                'trending-up': '📈',
                'trending-down': '📉',
                'x': '✖️'
            };
            return <span style={{ fontSize: size, display: 'inline-flex' }} className={className}>{icons[name] || '•'}</span>;
        };

        // API Helper
        const fetchAPI = async (url, options = {}) => {
            const res = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', ...options.headers }
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'API Error');
            return data;
        };

        // --- COMPONENTS ---

        const StatCard = ({ label, value, icon, trend, trendValue }) => (
            <div className="stat-card">
                <div className="stat-label">
                    <Icon name={icon} size={16} />
                    {label}
                </div>
                <div className="stat-value">{value}</div>
                {trend && (
                    <div className={`stat-trend ${trend === 'up' ? 'trend-up' : 'trend-down'}`}>
                        <Icon name={trend === 'up' ? 'trending-up' : 'trending-down'} size={14} />
                        {trendValue}
                    </div>
                )}
            </div>
        );

        const SidebarNav = ({ activeTab, onTabChange, apiStatus }) => (
            <div className="sidebar">
                <div className="logo">
                    <Icon name="shield-check" size={28} />
                    <span>SENTRY-AI</span>
                </div>
                <div className="nav-items">
                    {[
                        { id: 'overview', name: 'Overview', icon: 'layout' },
                        { id: 'monitor', name: 'Live Monitor', icon: 'activity' },
                        { id: 'analysis', name: 'Threat Analysis', icon: 'search' },
                        { id: 'training', name: 'Model Training', icon: 'cpu' },
                        { id: 'settings', name: 'Configuration', icon: 'settings' },
                    ].map(item => (
                        <div
                            key={item.id}
                            className={`nav-item ${activeTab === item.id ? 'active' : ''}`}
                            onClick={() => onTabChange(item.id)}
                        >
                            <Icon name={item.icon} />
                            {item.name}
                        </div>
                    ))}
                </div>
                <div style={{ marginTop: 'auto', padding: '20px', background: 'rgba(255,255,255,0.02)', borderRadius: '16px' }}>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-dim)', marginBottom: '4px' }}>API STATUS</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '0.9rem' }}>
                        <div style={{ width: 8, height: 8, borderRadius: '50%', background: apiStatus ? 'var(--success)' : 'var(--accent)', boxShadow: apiStatus ? '0 0 10px var(--success)' : '0 0 10px var(--accent)' }}></div>
                        {apiStatus ? 'Connected' : 'Disconnected'}
                    </div>
                </div>
            </div>
        );

        const ExplainDialog = ({ entityId, onClose }) => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const load = async () => {
                    try {
                        const res = await fetchAPI('/api/explain', {
                            method: 'POST',
                            body: JSON.stringify({ entity_id: entityId })
                        });
                        setData(res);
                    } catch (e) {
                        console.error(e);
                    } finally {
                        setLoading(false);
                    }
                };
                load();
            }, [entityId]);

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="close-btn" onClick={onClose}><Icon name="x" /></div>
                        <h2>Anomaly Explanation</h2>
                        <p className="subtitle" style={{ marginBottom: '30px' }}>Entity: {entityId}</p>

                        {loading ? (
                            <div style={{ height: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                <div className="spinner"></div>
                            </div>
                        ) : data ? (
                            <div>
                                <h3 style={{ marginBottom: '20px' }}>Sequence Influence Factor</h3>
                                <ResponsiveContainer width="100%" height={250}>
                                    <BarChart data={data.tokens}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" />
                                        <XAxis dataKey="index" stroke="var(--text-dim)" />
                                        <YAxis stroke="var(--text-dim)" />
                                        <Tooltip
                                            contentStyle={{ background: 'var(--bg-deep)', border: '1px solid var(--border)', borderRadius: 12 }}
                                            labelStyle={{ color: 'var(--primary)' }}
                                        />
                                        <Bar dataKey="importance">
                                            {data.tokens.map((entry, index) => (
                                                <Cell
                                                    key={`cell-${index}`}
                                                    fill={entry.importance > 0.1 ? 'var(--accent)' : 'var(--primary)'}
                                                    fillOpacity={0.6 + (entry.importance * 3)}
                                                />
                                            ))}
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>

                                <div style={{ marginTop: '40px' }}>
                                    <h3 style={{ marginBottom: '15px' }}>Token Relevancy Map</h3>
                                    <div className="token-cloud">
                                        {data.tokens.map(token => (
                                            <div key={token.index} className="token-tag" style={{
                                                borderColor: token.importance > 0.1 ? 'rgba(255,0,122,0.3)' : 'var(--border)',
                                                transform: `scale(${1 + token.importance * 0.5})`
                                            }}>
                                                <span style={{ color: token.importance > 0.1 ? 'var(--accent)' : 'var(--primary)' }}>
                                                    {token.token_str.split('|')[0]}
                                                </span>
                                                <div className="token-importance" style={{
                                                    width: `${token.importance * 100}%`,
                                                    background: token.importance > 0.1 ? 'var(--accent)' : 'var(--primary)'
                                                }}></div>
                                                <span style={{ fontSize: '0.6rem', color: 'var(--text-dim)' }}>{token.token_str.split('|')[1]}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <p>Unable to load explanation data.</p>
                        )}
                    </div>
                </div>
            );
        };

        const TrainingTab = ({ stats, config, setConfig, onTrain, trainingState }) => (
            <div className="panel" style={{ maxWidth: 800, margin: '0 auto' }}>
                <div className="panel-title">
                    <span><Icon name="cpu" style={{ verticalAlign: 'middle', marginRight: 10 }} /> Model Optimization</span>
                    <span style={{ fontSize: '0.8rem', color: 'var(--text-dim)' }}>Last Trained: {stats.last_trained || 'Never'}</span>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', marginBottom: '30px' }}>
                    <div className="input-group">
                        <label>Training Epochs</label>
                        <input type="number" value={config.epochs} onChange={e => setConfig({ ...config, epochs: e.target.value })} />
                    </div>
                    <div className="input-group">
                        <label>Batch Size</label>
                        <input type="number" value={config.batchSize} onChange={e => setConfig({ ...config, batchSize: e.target.value })} />
                    </div>
                    <div className="input-group">
                        <label>Learning Rate</label>
                        <input type="number" step="0.0001" value={config.learningRate} onChange={e => setConfig({ ...config, learningRate: e.target.value })} />
                    </div>
                    <div className="input-group">
                        <label>Sequence length</label>
                        <input type="number" value={stats.seqLen || 0} disabled />
                    </div>
                </div>

                <button className="btn" onClick={onTrain} disabled={trainingState.is_training}>
                    {trainingState.is_training ? <div className="spinner"></div> : <Icon name="play" />}
                    {trainingState.is_training ? 'Training Model...' : 'Start Advanced Training'}
                </button>

                {trainingState.is_training && (
                    <div className="progress-container">
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.9rem', marginBottom: '8px' }}>
                            <span>Progress</span>
                            <span style={{ fontFamily: 'var(--font-mono)' }}>{trainingState.progress}</span>
                        </div>
                        <div className="progress-bar">
                            <div className="progress-fill" style={{ width: trainingState.progress.includes('%') ? trainingState.progress.split('%')[0].split('-')[1].trim() + '%' : '10%' }}></div>
                        </div>
                    </div>
                )}

                <div style={{ marginTop: '30px', padding: '20px', borderRadius: '16px', background: 'rgba(0,184,255,0.05)', color: 'var(--text-dim)', fontSize: '0.85rem' }}>
                    <p><Icon name="info" size={14} style={{ marginRight: 6 }} /> Training uses the <strong>Improved Transformer</strong> architecture with multi-head attention and residual normalization layers for superior pattern recognition.</p>
                </div>
            </div>
        );

        const MonitorTab = ({ onAnalyze }) => {
            const [form, setForm] = useState({ entity_id: '', event_type: 'TCP_WELL_KNOWN', dst_id: '', bytes: 0 });
            const [status, setStatus] = useState(null);

            const handleSubmit = async () => {
                try {
                    const res = await fetchAPI('/api/events/ingest', { method: 'POST', body: JSON.stringify(form) });
                    setStatus(res);
                } catch (e) { console.error(e); }
            };

            return (
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }}>
                    <div className="panel">
                        <div className="panel-title">Manual Event Ingestion</div>
                        <div className="input-group">
                            <label>Entity ID (Source IP)</label>
                            <input placeholder="192.168.1.100" value={form.entity_id} onChange={e => setForm({ ...form, entity_id: e.target.value })} />
                        </div>
                        <div className="input-group">
                            <label>Event Type</label>
                            <select value={form.event_type} onChange={e => setForm({ ...form, event_type: e.target.value })}>
                                {['TCP_RECV', 'TCP_SEND', 'UDP_RECV', 'UDP_SEND', 'EXTERNAL_SCAN', 'LOGIN_ATTEMPT', 'DNS_QUERY'].map(t => (
                                    <option key={t} value={t}>{t}</option>
                                ))}
                            </select>
                        </div>
                        <div className="input-group">
                            <label>Destination Port</label>
                            <input value={form.dst_id} placeholder="e.g. 443" onChange={e => setForm({ ...form, dst_id: e.target.value })} />
                        </div>
                        <div className="input-group">
                            <label>Volume (Bytes)</label>
                            <input type="number" value={form.bytes} onChange={e => setForm({ ...form, bytes: parseInt(e.target.value) })} />
                        </div>
                        <button className="btn btn-outline" onClick={handleSubmit}>Simulate Payload</button>
                    </div>

                    <div className="panel">
                        <div className="panel-title">Real-time Analysis Result</div>
                        {status ? (
                            <div>
                                <div style={{ textAlign: 'center', padding: '30px' }}>
                                    <div style={{ fontSize: '3rem', fontWeight: 700, color: status.anomaly_score.is_anomaly ? 'var(--accent)' : 'var(--success)' }}>
                                        {status.anomaly_score.nll.toFixed(2)}
                                    </div>
                                    <div style={{ color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: 2, fontSize: '0.8rem' }}>Anomaly Index (NLL)</div>
                                </div>
                                <div style={{ padding: '20px', background: 'rgba(255,255,255,0.02)', borderRadius: 16 }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
                                        <span>Risk Level</span>
                                        <span style={{ color: status.anomaly_score.is_anomaly ? 'var(--accent)' : 'var(--success)' }}>
                                            {status.anomaly_score.is_anomaly ? 'CRITICAL' : 'MINIMAL'}
                                        </span>
                                    </div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                        <span>Z-Score</span>
                                        <span style={{ fontFamily: 'var(--font-mono)' }}>{status.anomaly_score.z_score?.toFixed(4) || 'N/A'}</span>
                                    </div>
                                </div>
                                <button className="btn" style={{ marginTop: 20 }} onClick={() => onAnalyze(form.entity_id)}>
                                    <Icon name="search" /> Visualize Explanation
                                </button>
                            </div>
                        ) : (
                            <div style={{ height: '70%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-dim)', textAlign: 'center' }}>
                                <div><Icon name="cloud-lightning" size={48} style={{ opacity: 0.2, marginBottom: 15 }} /><br />Pending data ingestion...</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        function App() {
            useIcons();
            const [activeTab, setActiveTab] = useState('overview');
            const [stats, setStats] = useState({ totalEvents: 0, anomaliesDetected: 0, activeEntities: 0, modelAccuracy: 0, last_trained: null, eventsTrend: 0, anomaliesTrend: 0, entitiesTrend: 0, inferenceLatencyMs: 0, anomalyRate: 0, engineName: 'N/A', seqLen: 0, alertThreshold: 3.0, maxBufferSize: 1000, modelLoaded: false });
            const [timeline, setTimeline] = useState([]);
            const [alerts, setAlerts] = useState([]);
            const [trainingState, setTrainingState] = useState({ is_training: false, progress: '' });
            const [trainConfig, setTrainConfig] = useState({ epochs: 10, batchSize: 32, learningRate: 0.0001 });
            const [explainEntity, setExplainEntity] = useState(null);
            const [apiStatus, setApiStatus] = useState(false);

            const loadData = async () => {
                try {
                    const [s, t, a, ts] = await Promise.all([
                        fetchAPI('/api/stats'),
                        fetchAPI('/api/timeline'),
                        fetchAPI('/api/alerts?limit=15'),
                        fetchAPI('/api/train/status')
                    ]);
                    setStats(s);
                    setTimeline(t);
                    setAlerts(a);
                    setTrainingState(ts);
                    setApiStatus(true);
                } catch (e) {
                    console.error('Data pull failed', e);
                    setApiStatus(false);
                }
            };

            useEffect(() => {
                loadData();
                const timer = setInterval(loadData, 5000);
                return () => clearInterval(timer);
            }, []);

            const handleTrain = async () => {
                try {
                    await fetchAPI('/api/train', { method: 'POST', body: JSON.stringify(trainConfig) });
                    loadData();
                } catch (e) { alert(e.message); }
            };

            return (
                <div className="app-layout">
                    <SidebarNav activeTab={activeTab} onTabChange={setActiveTab} apiStatus={apiStatus} />

                    <main className="main-content">
                        <header>
                            <div>
                                <h2>{activeTab.charAt(0).toUpperCase() + activeTab.slice(1)} Dashboard</h2>
                                <div className="subtitle">Security Monitoring & Neural Anomaly Prediction</div>
                            </div>
                            <div style={{ display: 'flex', gap: '12px' }}>
                                <button className="btn btn-outline" style={{ width: 'auto' }} onClick={loadData}>
                                    <Icon name="refresh-cw" size={16} />
                                </button>
                                <div style={{ background: 'var(--bg-card)', padding: '10px 20px', borderRadius: 12, border: '1px solid var(--border)', fontSize: '0.9rem' }}>
                                    <Icon name="calendar" size={14} style={{ marginRight: 8, verticalAlign: 'middle' }} />
                                    {new Date().toLocaleDateString()}
                                </div>
                            </div>
                        </header>

                        {activeTab === 'overview' && (
                            <div>
                                <div className="stats-grid">
                                    <StatCard label="Total Events" value={stats.totalEvents.toLocaleString()} icon="database" trend={stats.eventsTrend !== 0 ? (stats.eventsTrend > 0 ? 'up' : 'down') : null} trendValue={stats.eventsTrend !== 0 ? `${stats.eventsTrend > 0 ? '+' : ''}${stats.eventsTrend}%` : null} />
                                    <StatCard label="Live Entities" value={stats.activeEntities.toLocaleString()} icon="users" trend={stats.entitiesTrend !== 0 ? (stats.entitiesTrend > 0 ? 'up' : 'down') : null} trendValue={stats.entitiesTrend !== 0 ? `${stats.entitiesTrend > 0 ? '+' : ''}${stats.entitiesTrend}%` : null} />
                                    <StatCard label="Threats Prevented" value={stats.anomaliesDetected} icon="alert-triangle" trend={stats.anomaliesTrend !== 0 ? (stats.anomaliesTrend > 0 ? 'up' : 'down') : null} trendValue={stats.anomaliesTrend !== 0 ? `${stats.anomaliesTrend > 0 ? '+' : ''}${stats.anomaliesTrend}%` : null} />
                                    <StatCard label="Model Reliability" value={`${stats.modelAccuracy}%`} icon="target" />
                                </div>

                                <div className="dashboard-grid">
                                    <div className="panel">
                                        <div className="panel-title">Anomaly Timeline</div>
                                        <ResponsiveContainer width="100%" height={300}>
                                            <AreaChart data={timeline}>
                                                <defs>
                                                    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="var(--primary)" stopOpacity={0.3} />
                                                        <stop offset="95%" stopColor="var(--primary)" stopOpacity={0} />
                                                    </linearGradient>
                                                </defs>
                                                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.03)" vertical={false} />
                                                <XAxis dataKey="time" stroke="var(--text-dim)" axisLine={false} tickLine={false} />
                                                <YAxis stroke="var(--text-dim)" axisLine={false} tickLine={false} />
                                                <Tooltip
                                                    contentStyle={{ background: 'var(--bg-deep)', border: '1px solid var(--border)', borderRadius: 16, backdropFilter: 'blur(10px)' }}
                                                    itemStyle={{ color: 'var(--primary)' }}
                                                />
                                                <Area type="monotone" dataKey="events" stroke="var(--primary)" fill="url(#glow)" strokeWidth={3} />
                                                <Area type="monotone" dataKey="anomalies" stroke="var(--accent)" fill="transparent" strokeWidth={2} strokeDasharray="5 5" />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="panel">
                                        <div className="panel-title">Model Health</div>
                                        <div style={{ height: 300, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: '20px' }}>
                                            <div>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, fontSize: '0.9rem' }}>
                                                    <span>Inference Latency</span>
                                                    <span>{stats.inferenceLatencyMs > 0 ? `${stats.inferenceLatencyMs}ms` : 'N/A'}</span>
                                                </div>
                                                <div className="progress-bar"><div className="progress-fill" style={{ width: `${Math.min(stats.inferenceLatencyMs / 5, 100)}%`, background: stats.inferenceLatencyMs < 50 ? 'var(--success)' : stats.inferenceLatencyMs < 200 ? 'var(--warning)' : 'var(--accent)' }}></div></div>
                                            </div>
                                            <div>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, fontSize: '0.9rem' }}>
                                                    <span>Anomaly Rate</span>
                                                    <span>{stats.anomalyRate}%</span>
                                                </div>
                                                <div className="progress-bar"><div className="progress-fill" style={{ width: `${Math.min(stats.anomalyRate * 10, 100)}%`, background: 'var(--primary)' }}></div></div>
                                            </div>
                                            <div style={{ marginTop: 20, textAlign: 'center' }}>
                                                <div style={{ fontSize: '0.8rem', color: 'var(--text-dim)', marginBottom: 10 }}>AI ENGINE</div>
                                                <div style={{ fontWeight: 700, letterSpacing: 1 }}>{stats.engineName}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="panel">
                                    <div className="panel-title">High-Risk Alerts Detected</div>
                                    <table className="alerts-table">
                                        <thead>
                                            <tr>
                                                <th>Source Entity</th>
                                                <th>Evidence</th>
                                                <th>Score</th>
                                                <th>Severity</th>
                                                <th>Timestamp</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {alerts.map(a => (
                                                <tr key={a.id}>
                                                    <td style={{ fontWeight: 600 }}>{a.entity}</td>
                                                    <td>{a.reason}</td>
                                                    <td style={{ fontFamily: 'var(--font-mono)' }}>{a.score.toFixed(3)}</td>
                                                    <td>
                                                        <span className={`severity-badge sev-${a.severity}`}>
                                                            {a.severity}
                                                        </span>
                                                    </td>
                                                    <td style={{ color: 'var(--text-dim)' }}>{new Date(a.timestamp).toLocaleTimeString()}</td>
                                                    <td>
                                                        <button
                                                            className="btn btn-outline"
                                                            style={{ padding: '6px 12px', fontSize: '0.75rem', width: 'auto' }}
                                                            onClick={() => setExplainEntity(a.entity)}
                                                        >
                                                            Explain
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'monitor' && <MonitorTab onAnalyze={setExplainEntity} />}

                        {activeTab === 'training' && (
                            <TrainingTab
                                stats={stats}
                                config={trainConfig}
                                setConfig={setTrainConfig}
                                onTrain={handleTrain}
                                trainingState={trainingState}
                            />
                        )}

                        {activeTab === 'settings' && (
                            <div className="panel">
                                <div className="panel-title">System Configuration</div>
                                <div className="input-group">
                                    <label>Alert Threshold (Z-Score)</label>
                                    <input type="number" value={stats.alertThreshold} disabled />
                                </div>
                                <div className="input-group">
                                    <label>Max Buffer Size</label>
                                    <input type="number" value={stats.maxBufferSize} disabled />
                                </div>
                                <div className="input-group">
                                    <label>Data Source API</label>
                                    <input defaultValue="http://localhost:5000/api" disabled />
                                </div>
                            </div>
                        )}
                    </main>

                    {explainEntity && (
                        <ExplainDialog entityId={explainEntity} onClose={() => setExplainEntity(null)} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
